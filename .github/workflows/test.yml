name: test

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    # macos-15: l'unico runner macOS validato da setup-supercollider
    runs-on: macos-15
    # la prima compilazione di SuperCollider dai sorgenti è lunga; ccache accorcia le successive
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: macos-15-supercollider-3.14.1
          restore-keys: macos-15-supercollider-3.14.1
      - uses: supriya-project/setup-supercollider@85a9b85efce9af26b32d30ed8ee293fa65ca675f # v1.1.3
        id: sc
        with:
          ref: Version-3.14.1
      # La build headless non viene riconosciuta come bundle: sclang cerca le risorse
      # (SCClassLibrary, scsynth, plugins) accanto all'eseguibile, in Contents/MacOS
      # (SC_Filesystem_macos.cpp, defaultResourceDirectory). Una copia in Contents/Resources
      # parte da dove le risorse ci sono davvero.
      - name: sclang accanto alle risorse
        run: |
          contents=$(dirname "$(dirname "$SCLANG_PATH")")
          ls "$contents/MacOS" "$contents/MacOS/SCClassLibrary" || true
          cp "$SCLANG_PATH" "$contents/Resources/sclang"
          echo "SCLANG=$contents/Resources/sclang" >> "$GITHUB_ENV"
        env:
          SCLANG_PATH: ${{ steps.sc.outputs.sclang_path }}
      - name: test-all (runner, unit, nrt)
        run: make test-all
